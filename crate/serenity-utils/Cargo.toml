[package]
name = "serenity-utils"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "serenity_utils"
path = "src/lib.rs"

[dependencies]
futures = "0.3" # used in proc macro
parking_lot = "0.12" # used in proc macro
shlex = "1" # used in proc macro
thiserror = "2" # used in proc macro

[dependencies.chrono]
version = "0.4"
default-features = false
optional = true

[dependencies.derive_more] # used in proc macro
version = "0.99"
default-features = false
features = ["from"]

[dependencies.jiff]
version = "0.2"
default-features = false
optional = true

[dependencies.serenity]
version = "0.12"
features = ["unstable_discord_api"]

[dependencies.serenity-utils-derive]
version = "=0.11.0"
path = "../serenity-utils-derive"

[dependencies.tokio]
version = "1.3"
features = [
    "io-util",
    "net",
    "rt-multi-thread", # used in proc macro
    "sync",
    "time",
]

[dependencies.tokio-stream] # used in proc macro
version = "0.1"
features = ["io-util", "net"]
